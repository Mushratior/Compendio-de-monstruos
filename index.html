<head>
    <meta charset="UTF-8">

    <title>Catálogo Completo de Monstruos - D&D Manual de Monstruos</title>
    <style>
        :root {
            --primary: #7a200d;
            --bg: #f4f1ea;
            --card-bg: #ffffff;
            --text: #2c2c2c;
            --border: #dcd6cd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .filters {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: var(--primary);
        }

        .filter-group input, 
        .filter-group select {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.95rem;
            outline: none;
        }

        .filter-group input:focus, 
        .filter-group select:focus {
            border-color: var(--primary);
        }

        .stats-bar {
            margin-bottom: 15px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #555;
        }

        .monster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .monster-card {
            background-color: var(--card-bg);
            border-top: 4px solid var(--primary);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .monster-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.12);
        }

        .monster-image-container {
            width: 100%;
            height: 160px;
            background-color: #e9e3d9;
            position: relative;
            overflow: hidden;
        }

        .monster-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .monster-content {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .monster-name {
            font-size: 1rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 6px;
        }

        .monster-info {
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 10px;
        }

        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .tag {
            display: inline-block;
            background: #f0e6df;
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 40px;
            background: var(--card-bg);
            border-radius: 8px;
            color: #777;
        }
    </style>
</head>

    document.addEventListener('DOMContentLoaded', () => {
        const searchInput = document.getElementById('search-name');
        const habitatSelect = document.getElementById('filter-habitat');
        const crSelect = document.getElementById('filter-cr');
        const monsterGrid = document.getElementById('monster-grid');
        const statsBar = document.getElementById('stats-bar');

        function getPlaceholderUrl(monsterName) {
            return `https://placehold.co/400x300/7a200d/ffffff?text=${encodeURIComponent(monsterName)}`;
        }

        function renderMonsters() {
            const nameQuery = searchInput ? searchInput.value.toLowerCase().trim() : '';
            const selectedHabitat = habitatSelect ? habitatSelect.value : 'all';
            const selectedCr = crSelect ? crSelect.value : 'all';

            const filtered = monsters.filter(m => {
                const matchesName = m.name.toLowerCase().includes(nameQuery);
                const matchesHabitat = selectedHabitat === 'all' || m.habitat === selectedHabitat;
                
                let matchesCr = true;
                if (selectedCr !== 'all') {
                    const targetCr = parseFloat(selectedCr);
                    if (targetCr === 20) {
                        matchesCr = m.cr >= 20;
                    } else {
                        matchesCr = m.cr === targetCr;
                    }
                }

                return matchesName && matchesHabitat && matchesCr;
            });

            if (statsBar) {
                statsBar.textContent = `Mostrando ${filtered.length} de ${monsters.length} criaturas extraídas del índice`;
            }

            if (!monsterGrid) return;

            if (filtered.length === 0) {
                monsterGrid.innerHTML = `<div class="no-results">No se encontraron monstruos con los filtros seleccionados.</div>`;
                return;
            }

            monsterGrid.innerHTML = filtered.map(m => {
                const imageUrl = getPlaceholderUrl(m.name);
                return `
                <div class="monster-card">
                    <div class="monster-image-container">
                        <img 
                            class="monster-image" 
                            src="${imageUrl}" 
                            alt="Ilustración de ${m.name}"
                            loading="lazy"
                        />
                    </div>
                    <div class="monster-content">
                        <div>
                            <div class="monster-name">${m.name}</div>
                            <div class="monster-info">
                                <strong>Página:</strong> ${m.page}
                            </div>
                        </div>
                        <div class="tag-container">
                            <span class="tag">CD: ${m.crText}</span>
                            <span class="tag">${m.habitat}</span>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        if (searchInput) searchInput.addEventListener('input', renderMonsters);
        if (habitatSelect) habitatSelect.addEventListener('change', renderMonsters);
        if (crSelect) crSelect.addEventListener('change', renderMonsters);

        renderMonsters();
    });
