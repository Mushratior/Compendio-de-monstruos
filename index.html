<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compendio de Monstruos - D&D 5e</title>
    <style>
        :root {
            --primary-red: #8b0000;
            --dark-red: #580000;
            --bg-paper: #f4e9d8;
            --card-bg: #fffdfa;
            --statblock-bg: #fdf6e7;
            --text-color: #2b1810;
            --border-color: #c9ad80;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: var(--bg-paper);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--primary-red);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-red);
            margin: 0;
            text-transform: uppercase;
        }

        .subtitle {
            font-style: italic;
            color: #666;
            margin-top: 5px;
        }

        .app-layout {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .app-layout {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .search-bar {
            width: 100%;
            padding: 8px 12px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--statblock-bg);
            margin-bottom: 12px;
            font-family: inherit;
        }

        .monster-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
        }

        .monster-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .monster-item:hover {
            background-color: var(--statblock-bg);
        }

        .monster-item.active {
            background-color: var(--primary-red);
            color: white;
            border-radius: 4px;
        }

        .monster-item.active .monster-cr {
            color: #ffd700;
        }

        .monster-cr {
            font-size: 0.85em;
            color: var(--primary-red);
            font-weight: bold;
        }

        .statblock-container {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            position: relative;
            min-height: 400px;
        }

        .statblock-header {
            border-bottom: 2px solid var(--primary-red);
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .statblock-title {
            color: var(--primary-red);
            margin: 0;
            font-size: 1.8em;
        }

        .statblock-meta {
            font-style: italic;
            font-size: 0.95em;
            color: #555;
            margin-top: 2px;
        }

        .taper-line {
            height: 5px;
            background: linear-gradient(to right, var(--primary-red), transparent);
            margin: 10px 0;
        }

        .property-line {
            color: var(--dark-red);
            margin: 4px 0;
            font-size: 0.95em;
        }

        .property-line strong {
            color: var(--text-color);
        }

        .abilities-table {
            width: 100%;
            text-align: center;
            border-collapse: collapse;
            margin: 15px 0;
            background-color: var(--statblock-bg);
            border-radius: 4px;
            padding: 5px;
        }

        .abilities-table th {
            color: var(--primary-red);
            font-size: 0.85em;
            text-transform: uppercase;
            padding: 4px;
        }

        .abilities-table td {
            font-size: 0.95em;
            padding: 4px;
        }

        .section-header {
            color: var(--primary-red);
            font-size: 1.2em;
            border-bottom: 1px solid var(--primary-red);
            margin-top: 15px;
            margin-bottom: 8px;
            padding-bottom: 2px;
        }

        .action-block {
            margin-bottom: 10px;
            font-size: 0.95em;
            line-height: 1.4;
        }

        .action-name {
            font-weight: bold;
            font-style: italic;
        }

        .description-text {
            font-size: 0.95em;
            line-height: 1.5;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px dashed var(--border-color);
            color: #444;
        }

        .status-msg {
            text-align: center;
            color: #777;
            font-style: italic;
            padding: 40px;
        }

        .loading-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.85);
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: var(--primary-red);
            font-size: 1.2em;
            border-radius: 6px;
            z-index: 10;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Compendio de Monstruos D&D 5e</h1>
        <div class="subtitle">Traducción Técnica Integrada (Open5e API)</div>
    </header>

    <div class="app-layout">
        <div class="sidebar">
            <input type="text" id="searchInput" class="search-bar" placeholder="Buscar monstruo (ej: Zombie, Dragon, Skeleton)...">
            <ul class="monster-list" id="monsterList"></ul>
        </div>

        <div class="statblock-container" id="statblockView">
            <div id="loading" class="loading-overlay">Cargando y traduciendo ficha...</div>
            <div id="content">
                <div class="status-msg">Selecciona un monstruo de la lista para cargar su ficha.</div>
            </div>
        </div>
    </div>
</div>

<script>
let searchTimeout = null;
let currentMonsters = [];

const alignmentsDict = {
    "lawful good": "Legal Bueno",
    "neutral good": "Neutral Bueno",
    "chaotic good": "Caótico Bueno",
    "lawful neutral": "Legal Neutral",
    "neutral": "Neutral",
    "neutral evil": "Neutral Maligno",
    "chaotic neutral": "Caótico Neutral",
    "lawful evil": "Legal Maligno",
    "chaotic evil": "Caótico Maligno",
    "unaligned": "Sin Alineamiento",
    "any alignment": "Cualquier Alineamiento"
};

const monsterNamesDict = {
    "Skeleton": "Esqueleto",
    "Zombie": "Zombi",
    "Ghoul": "Ghul",
    "Specter": "Espectro",
    "Shadow": "Sombra",
    "Wight": "Tumulario",
    "Mummy": "Momia",
    "Lich": "Liche",
    "Vampire": "Vampiro",
    "Ghost": "Fantasma",
    "Goblin": "Goblin",
    "Orc": "Orco",
    "Ogre": "Ogro",
    "Troll": "Trol",
    "Wolf": "Lobo"
};

const dndDictionary = {
    "aberration": "Aberración",
    "beast": "Bestia",
    "celestial": "Celestial",
    "construct": "Constructo",
    "dragon": "Dragón",
    "elemental": "Elemental",
    "fiend": "Infernal",
    "giant": "Gigante",
    "humanoid": "Humanoide",
    "monstrosity": "Monstruosidad",
    "ooze": "Cieno",
    "plant": "Planta",
    "undead": "No-muerto",
    "Tiny": "Diminuto",
    "Small": "Pequeño",
    "Medium": "Mediano",
    "Large": "Grande",
    "Huge": "Enorme",
    "Gargantuan": "Gargantesco"
};

function translateMonsterName(name) {
    return monsterNamesDict[name] || name;
}

function translateAlignment(alignment) {
    if (!alignment) return "Sin alineamiento";
    const lowerAlign = alignment.toLowerCase().trim();
    return alignmentsDict[lowerAlign] || alignment;
}

function formatMod(score) {
    if (score === undefined || score === null) return '—';
    const mod = Math.floor((score - 10) / 2);
    return `${score} (${mod >= 0 ? '+' + mod : mod})`;
}

function formatSpeed(speedObj) {
    if (!speedObj) return '0 pies';
    if (typeof speedObj === 'string') return speedObj;
    let parts = [];
    if (speedObj.walk) parts.push(`${speedObj.walk} pies`);
    if (speedObj.fly) parts.push(`vuelo ${speedObj.fly} pies`);
    if (speedObj.swim) parts.push(`natación ${speedObj.swim} pies`);
    if (speedObj.climb) parts.push(`escalada ${speedObj.climb} pies`);
    if (speedObj.burrow) parts.push(`excavar ${speedObj.burrow} pies`);
    return parts.join(', ') || '0 pies';
}

async function translate(text) {
    if (!text || text.trim() === '') return '';
    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 3000); // 3s timeout por seguridad
        
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.substring(0, 450))}&langpair=en|es`, {
            signal: controller.signal
        });
        clearTimeout(timeoutId);
        
        if (!res.ok) return text;
        const data = await res.json();
        return data.responseData?.translatedText || text;
    } catch (e) {
        // En caso de bloqueo CORS o Timeout, devuelve el texto original en inglés sin romper la UI
        return text;
    }
}

async function fetchMonsterList(query = '') {
    const listElement = document.getElementById('monsterList');
    listElement.innerHTML = '<li class="monster-item">Cargando resultados...</li>';

    try {
        // Usamos la API v1 con búsqueda universal por texto
        const url = query 
            ? `https://api.open5e.com/v1/monsters/?search=${encodeURIComponent(query)}&limit=40`
            : `https://api.open5e.com/v1/monsters/?limit=40`;
        
        const response = await fetch(url);
        if (!response.ok) throw new Error("Error en la respuesta de la red");
        
        const data = await response.json();
        currentMonsters = data.results || [];

        listElement.innerHTML = '';
        if (currentMonsters.length === 0) {
            listElement.innerHTML = '<li class="monster-item">No se encontraron monstruos.</li>';
            return;
        }

        currentMonsters.forEach(monster => {
            const translatedName = translateMonsterName(monster.name);
            const li = document.createElement('li');
            li.className = 'monster-item';
            li.setAttribute('data-slug', monster.slug);
            
            li.onclick = () => loadAndTranslateMonster(monster.slug);

            li.innerHTML = `
                <span>${translatedName}</span>
                <span class="monster-cr">CR ${monster.challenge_rating || '—'}</span>
            `;
            listElement.appendChild(li);
        });

    } catch (error) {
        console.error("Error cargando la lista:", error);
        listElement.innerHTML = '<li class="monster-item">Error al conectar con la API.</li>';
    }
}

async function loadAndTranslateMonster(slug) {
    const monster = currentMonsters.find(m => m.slug === slug);
    if (!monster) return;

    // Actualizar selección visual
    document.querySelectorAll('.monster-item').forEach(el => el.classList.remove('active'));
    const activeEl = document.querySelector(`[data-slug="${slug}"]`);
    if (activeEl) activeEl.classList.add('active');

    const loader = document.getElementById('loading');
    loader.style.display = 'flex';

    try {
        const nameEs = translateMonsterName(monster.name);
        const alignEs = translateAlignment(monster.alignment);
        const sizeEs = dndDictionary[monster.size] || monster.size || '';
        const typeEs = dndDictionary[monster.type] || monster.type || '';

        // Traducción asíncrona segura con fallback
        const traitsPromises = (monster.special_abilities || []).map(async t => ({
            name: t.name,
            desc: await translate(t.desc)
        }));

        const actionsPromises = (monster.actions || []).map(async a => ({
            name: a.name,
            desc: await translate(a.desc)
        }));

        const [translatedTraits, translatedActions] = await Promise.all([
            Promise.all(traitsPromises),
            Promise.all(actionsPromises)
        ]);

        const content = document.getElementById('content');
        content.innerHTML = `
            <div class="statblock-header">
                <h2 class="statblock-title">${nameEs}</h2>
                <div class="statblock-meta">${sizeEs} ${typeEs}, ${alignEs}</div>
            </div>
            <div class="taper-line"></div>

            <div class="property-line"><strong>Clase de Armadura:</strong> ${monster.armor_class || '—'} (${monster.armor_desc || 'armadura natural'})</div>
            <div class="property-line"><strong>Puntos de Golpe:</strong> ${monster.hit_points || '—'} (${monster.hit_dice || '—'})</div>
            <div class="property-line"><strong>Velocidad:</strong> ${formatSpeed(monster.speed)}</div>

            <table class="abilities-table">
                <thead>
                    <tr>
                        <th>FUE</th><th>DES</th><th>CON</th><th>INT</th><th>SAB</th><th>CAR</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>${formatMod(monster.strength)}</td>
                        <td>${formatMod(monster.dexterity)}</td>
                        <td>${formatMod(monster.constitution)}</td>
                        <td>${formatMod(monster.intelligence)}</td>
                        <td>${formatMod(monster.wisdom)}</td>
                        <td>${formatMod(monster.charisma)}</td>
                    </tr>
                </tbody>
            </table>

            <div class="property-line"><strong>Sentidos:</strong> ${monster.senses || '—'}</div>
            <div class="property-line"><strong>Idiomas:</strong> ${monster.languages || '—'}</div>
            <div class="property-line"><strong>Desafío (CR):</strong> ${monster.challenge_rating || '—'}</div>

            <div class="taper-line"></div>

            ${translatedTraits.map(t => `
                <div class="action-block">
                    <span class="action-name">${t.name}.</span>${t.desc}
                </div>
            `).join('')}

            ${translatedActions.length > 0 ? `<div class="section-header">Acciones</div>` : ''}
            ${translatedActions.map(a => `
                <div class="action-block">
                    <span class="action-name">${a.name}.</span>${a.desc}
                </div>
            `).join('')}

            ${monster.desc ? `
                <div class="description-text">
                    <strong>Descripción:</strong> ${monster.desc}
                </div>
            ` : ''}
        `;
    } catch (err) {
        console.error("Error al renderizar el monstruo:", err);
    } finally {
        loader.style.display = 'none';
    }
}

// Inicialización de eventos
window.addEventListener('DOMContentLoaded', () => {
    const searchInput = document.getElementById('searchInput');
    
    searchInput.addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            fetchMonsterList(e.target.value.trim());
        }, 300);
    });

    fetchMonsterList();
});
</script>

</body>
</html>
