<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de Monstruos D&D</title>
  <style>
    body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 15px; }
    h1 { text-align: center; color: #e74c3c; margin-top: 0; }
    .filtros { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    input, select { padding: 10px; border-radius: 6px; border: 1px solid #333; background: #222; color: #fff; font-size: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    .card { background: #1e1e1e; border: 1px solid #333; border-radius: 8px; overflow: hidden; padding: 15px; }
    .card img { width: 100%; height: 200px; object-fit: contain; background: #000; border-radius: 6px; }
    .card h2 { color: #f39c12; margin: 10px 0 5px 0; }
    .tag { display: inline-block; background: #e74c3c; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 12px; margin-right: 5px; }
    .stats { margin-top: 10px; font-size: 14px; color: #ccc; }
  </style>
</head>
<body>

  <h1>Compendio de Criaturas</h1>

  <!-- BUSCADOR Y FILTROS -->
  <div class="filtros">
    <input type="text" id="busqueda" placeholder="Buscar por nombre..." oninput="filtrar()">
    
    <select id="filtroTipo" onchange="filtrar()">
      <option value="">Todos los Tipos</option>
      <option value="Aberración">Aberración</option>
      <option value="Feérico">Feérico</option>
      <option value="Bestia">Bestia</option>
    </select>

    <select id="filtroHabitat" onchange="filtrar()">
      <option value="">Todos los Hábitats</option>
      <option value="subterraneo">Subterráneo</option>
      <option value="bosque">Bosque</option>
      <option value="acuatico">Acuático</option>
    </select>
  </div>

  <!-- CONTENEDOR DE TARJETAS -->
  <div id="resultado" class="grid"></div>

  <script>
    // BASE DE DATOS LOCAL (JSON en Español con enlaces a imágenes oficiales)
    const monstruos = [
      {
        id_en: "aboleth",
        nombre: "Aboleth",
        tipo: "Aberración",
        desafio: 10,
        habitat: ["acuatico", "subterraneo"],
        ca: 17,
        pg: 135,
        descripcion: "Una criatura anfibia prehistórica con temibles poderes psiónicos que habita en las profundidades.",
        imagen: "https://www.dnd5eapi.co/api/images/monsters/aboleth.png"
      },
      {
        id_en: "goblin",
        nombre: "Goblin",
        tipo: "Humanoide",
        desafio: 0.25,
        habitat: ["bosque", "subterraneo"],
        ca: 15,
        pg: 7,
        descripcion: "Un pequeño humanoide malicioso que prefiere atacar en grupo o mediante emboscadas.",
        imagen: "https://www.dnd5eapi.co/api/images/monsters/goblin.png"
      }
    ];

    function renderizar(lista) {
      const contenedor = document.getElementById('resultado');
      contenedor.innerHTML = '';

      if (lista.length === 0) {
        contenedor.innerHTML = '<p>No se encontraron monstruos con esos filtros.</p>';
        return;
      }

      lista.forEach(m => {
        contenedor.innerHTML += `
          <div class="card">
            <img src="${m.imagen}" alt="${m.nombre}" onerror="this.src='https://via.placeholder.com/300x200?text=Sin+Imagen'">
            <h2>${m.nombre}</h2>
            <div>
              <span class="tag">${m.tipo}</span>
              <span class="tag" style="background:#27ae60;">VD: ${m.desafio}</span>
            </div>
            <div class="stats">
              <p><strong>Clase de Armadura:</strong> ${m.ca}</p>
              <p><strong>Puntos de Golpe:</strong> ${m.pg}</p>
              <p><strong>Hábitats:</strong> ${m.habitat.join(', ')}</p>
              <p>${m.descripcion}</p>
            </div>
          </div>
        `;
      });
    }

    function filtrar() {
      const texto = document.getElementById('busqueda').value.toLowerCase();
      const tipo = document.getElementById('filtroTipo').value;
      const habitat = document.getElementById('filtroHabitat').value;

      const filtrados = monstruos.filter(m => {
        const coincideNombre = m.nombre.toLowerCase().includes(texto);
        const coincideTipo = tipo === '' || m.tipo === tipo;
        const coincideHabitat = habitat === '' || m.habitat.includes(habitat);
        return coincideNombre && coincideTipo && coincideHabitat;
      });

      renderizar(filtrados);
    }

    // Carga inicial al abrir la app
    renderizar(monstruos);
  </script>
</body>
</html>
