<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compendio de Monstruos - D&D 5e</title>
    <style>
        :root {
            --primary-red: #8b0000;
            --dark-red: #580000;
            --bg-paper: #f4e9d8;
            --card-bg: #fffdfa;
            --statblock-bg: #fdf6e7;
            --text-color: #2b1810;
            --border-color: #c9ad80;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: var(--bg-paper);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--primary-red);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-red);
            margin: 0;
            text-transform: uppercase;
        }

        .subtitle {
            font-style: italic;
            color: #666;
            margin-top: 5px;
        }

        .app-layout {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .app-layout {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-height: 85vh;
            display: flex;
            flex-direction: column;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .search-bar, .filter-select {
            width: 100%;
            padding: 8px 12px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--statblock-bg);
            font-family: inherit;
            color: var(--text-color);
        }

        .filter-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .monster-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
        }

        .monster-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .monster-item:hover {
            background-color: var(--statblock-bg);
        }

        .monster-item.active {
            background-color: var(--primary-red);
            color: white;
            border-radius: 4px;
        }

        .monster-item.active .monster-cr {
            color: #ffd700;
        }

        .monster-cr {
            font-size: 0.85em;
            color: var(--primary-red);
            font-weight: bold;
        }

        .statblock-container {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            position: relative;
            min-height: 400px;
        }

        .statblock-header {
            border-bottom: 2px solid var(--primary-red);
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .statblock-title {
            color: var(--primary-red);
            margin: 0;
            font-size: 1.8em;
        }

        .taper-line {
            height: 5px;
            background: linear-gradient(to right, var(--primary-red), transparent);
            margin: 10px 0;
        }

        .property-line {
            color: var(--dark-red);
            margin: 4px 0;
            font-size: 0.95em;
        }

        .property-line strong {
            color: var(--text-color);
        }

        .abilities-table {
            width: 100%;
            text-align: center;
            border-collapse: collapse;
            margin: 15px 0;
            background-color: var(--statblock-bg);
            border-radius: 4px;
            padding: 5px;
        }

        .abilities-table th {
            color: var(--primary-red);
            font-size: 0.85em;
            text-transform: uppercase;
            padding: 4px;
        }

        .abilities-table td {
            font-size: 0.95em;
            padding: 4px;
        }

        .section-header {
            color: var(--primary-red);
            font-size: 1.2em;
            border-bottom: 1px solid var(--primary-red);
            margin-top: 15px;
            margin-bottom: 8px;
            padding-bottom: 2px;
        }

        .action-block {
            margin-bottom: 10px;
            font-size: 0.95em;
            line-height: 1.4;
        }

        .action-name {
            font-weight: bold;
            font-style: italic;
        }

        .description-text {
            font-size: 0.95em;
            line-height: 1.5;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px dashed var(--border-color);
            color: #444;
        }

        .status-msg {
            text-align: center;
            color: #777;
            font-style: italic;
            padding: 40px;
        }

        .loading-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.85);
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: var(--primary-red);
            font-size: 1.2em;
            border-radius: 6px;
            z-index: 10;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Compendio de Monstruos D&D 5e</h1>
        <div class="subtitle">Traducción Técnica e Integración Avanzada</div>
    </header>

    <div class="app-layout">
        <div class="sidebar">
            <div class="filter-group">
                <input type="text" id="searchInput" class="search-bar" placeholder="Buscar por nombre...">
                
                <div class="filter-row">
                    <select id="typeFilter" class="filter-select">
                        <option value="">Tipo (Todos)</option>
                        <option value="aberration">Aberración</option>
                        <option value="beast">Bestia</option>
                        <option value="celestial">Celestial</option>
                        <option value="construct">Constructo</option>
                        <option value="dragon">Dragón</option>
                        <option value="elemental">Elemental</option>
                        <option value="fey">Incorpóreo / Hada</option>
                        <option value="fiend">Infernal</option>
                        <option value="giant">Gigante</option>
                        <option value="humanoid">Humanoide</option>
                        <option value="monstrosity">Monstruosidad</option>
                        <option value="ooze">Cieno</option>
                        <option value="plant">Planta</option>
                        <option value="undead">No-muerto</option>
                    </select>

                    <select id="crFilter" class="filter-select">
                        <option value="">Desafío</option>
                        <option value="0">Desafío 0</option>
                        <option value="1/8">Desafío 1/8</option>
                        <option value="1/4">Desafío 1/4</option>
                        <option value="1/2">Desafío 1/2</option>
                        <option value="1">Desafío 1</option>
                        <option value="2">Desafío 2</option>
                        <option value="3">Desafío 3</option>
                        <option value="4">Desafío 4</option>
                        <option value="5">Desafío 5</option>
                        <option value="6">Desafío 6</option>
                        <option value="7">Desafío 7</option>
                        <option value="8">Desafío 8</option>
                        <option value="9">Desafío 9</option>
                        <option value="10">Desafío 10</option>
                        <option value="11">Desafío 11</option>
                        <option value="12">Desafío 12</option>
                        <option value="13">Desafío 13</option>
                        <option value="14">Desafío 14</option>
                        <option value="15">Desafío 15</option>
                        <option value="16">Desafío 16</option>
                        <option value="17">Desafío 17</option>
                        <option value="20">Desafío 20+</option>
                    </select>
                </div>
            </div>

            <ul class="monster-list" id="monsterList"></ul>
        </div>

        <div class="statblock-container" id="statblockView">
            <div id="loading" class="loading-overlay">Cargando y traduciendo ficha...</div>
            <div id="content">
                <div class="status-msg">Selecciona un monstruo de la lista para cargar su ficha.</div>
            </div>
        </div>
    </div>
</div>

<script>
let searchTimeout = null;
let currentMonsters = [];

const alignmentsDict = {
    "lawful good": "Legal Bueno",
    "neutral good": "Neutral Bueno",
    "chaotic good": "Caótico Bueno",
    "lawful neutral": "Legal Neutral",
    "neutral": "Neutral",
    "neutral evil": "Neutral Maligno",
    "chaotic neutral": "Caótico Neutral",
    "lawful evil": "Legal Maligno",
    "chaotic evil": "Caótico Maligno",
    "unaligned": "Sin Alineamiento",
    "any alignment": "Cualquier Alineamiento"
};

const monsterNamesDict = {
    "Skeleton": "Esqueleto",
    "Warhorse Skeleton": "Esqueleto de Caballo de Guerra",
    "Zombie": "Zombi",
    "Ogre Zombie": "Zombi Ogro",
    "Ghoul": "Ghul",
    "Ghast": "Ghast",
    "Specter": "Espectro",
    "Shadow": "Sombra",
    "Wight": "Tumulario",
    "Wraith": "Sombra Espectral / Wraith",
    "Mummy": "Momia",
    "Mummy Lord": "Señor de las Momias",
    "Lich": "Liche",
    "Vampire": "Vampiro",
    "Vampire Spawn": "Progenie Vampírica",
    "Ghost": "Fantasma",
    "Flameskull": "Calavera Flameante",
    "Goblin": "Goblin",
    "Orc": "Orco",
    "Ogre": "Ogro",
    "Troll": "Trol",
    "Wolf": "Lobo"
};

const dndDictionary = {
    "aberration": "Aberración",
    "beast": "Bestia",
    "celestial": "Celestial",
    "construct": "Constructo",
    "dragon": "Dragón",
    "elemental": "Elemental",
    "fey": "Incorpóreo/Hada",
    "fiend": "Infernal",
    "giant": "Gigante",
    "humanoid": "Humanoide",
    "monstrosity": "Monstruosidad",
    "ooze": "Cieno",
    "plant": "Planta",
    "undead": "No-muerto",
    "Tiny": "Diminuto",
    "Small": "Pequeño",
    "Medium": "Mediano",
    "Large": "Grande",
    "Huge": "Enorme",
    "Gargantuan": "Gargantesco",
    "natural armor": "armadura natural",
    "shield": "escudo",
    "leather armor": "armadura de cuero",
    "darkvision": "visión en la oscuridad",
    "blindsight": "visión a ciegas",
    "tremorsense": "percepción de la vibración",
    "truesight": "visión verdadera",
    "Multiattack": "Multiataque",
    "Bite": "Mordisco",
    "Claw": "Garra",
    "Claws": "Garras",
    "Tail": "Cola",
    "Gore": "Cornada",
    "Slam": "Golpe"
};

function translateMonsterName(name) {
    return monsterNamesDict[name] || name;
}

function translateAlignment(alignment) {
    if (!alignment) return "Sin alineamiento";
    const lowerAlign = alignment.toLowerCase().trim();
    return alignmentsDict[lowerAlign] || alignment;
}

function formatMod(score) {
    if (score === undefined || score === null) return '—';
    const mod = Math.floor((score - 10) / 2);
    return `${score} (${mod >= 0 ? '+' + mod : mod})`;
}

function formatSpeed(speedObj) {
    if (!speedObj) return '0 pies';
    if (typeof speedObj === 'string') return speedObj;
    let parts = [];
    if (speedObj.walk) parts.push(`${speedObj.walk} pies`);
    if (speedObj.fly) parts.push(`vuelo ${speedObj.fly} pies`);
    if (speedObj.swim) parts.push(`natación ${speedObj.swim} pies`);
    if (speedObj.climb) parts.push(`escalada ${speedObj.climb} pies`);
    if (speedObj.burrow) parts.push(`excavar ${speedObj.burrow} pies`);
    return parts.join(', ') || '0 pies';
}

function replaceTechnicalTerms(str) {
    if (!str) return '—';
    let result = str;
    for (const [key, val] of Object.entries(dndDictionary)) {
        const regex = new RegExp(`\\b${key}\\b`, 'gi');
        result = result.replace(regex, val);
    }
    return result;
}

async function translate(text) {
    if (!text || text.trim() === '') return '';
    try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 2500);

        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text.substring(0, 450))}&langpair=en|es`, {
            signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (!res.ok) return replaceTechnicalTerms(text);
        const data = await res.json();
        const translatedText = data.responseData?.translatedText || text;
        return replaceTechnicalTerms(translatedText);
    } catch (e) {
        return replaceTechnicalTerms(text);
    }
}

async function fetchMonsterList() {
    const listElement = document.getElementById('monsterList');
    listElement.innerHTML = '<li class="monster-item">Buscando monstruos...</li>';

    const searchVal = document.getElementById('searchInput').value.trim();
    const typeVal = document.getElementById('typeFilter').value;
    const crVal = document.getElementById('crFilter').value;

    try {
        let queryParams = new URLSearchParams({ limit: 40 });
        
        if (searchVal) queryParams.append('search', searchVal);
        if (typeVal) queryParams.append('type', typeVal);
        if (crVal) queryParams.append('challenge_rating', crVal);

        const url = `https://api.open5e.com/v1/monsters/?${queryParams.toString()}`;

        const response = await fetch(url);
        if (!response.ok) throw new Error("Error en la respuesta");

        const data = await response.json();
        currentMonsters = data.results || [];

        listElement.innerHTML = '';
        if (currentMonsters.length === 0) {
            listElement.innerHTML = '<li class="monster-item">Sin resultados.</li>';
            return;
        }

        currentMonsters.forEach(monster => {
            const translatedName = translateMonsterName(monster.name);
            const li = document.createElement('li');
            li.className = 'monster-item';
            li.setAttribute('data-slug', monster.slug);

            li.onclick = () => loadAndTranslateMonster(monster.slug);

            li.innerHTML = `
                <span>${translatedName}</span>
                <span class="monster-cr">Desafío ${monster.challenge_rating || '—'}</span>
            `;
            listElement.appendChild(li);
        });

    } catch (error) {
        console.error("Error al cargar la lista:", error);
        listElement.innerHTML = '<li class="monster-item">Error al conectar con la API.</li>';
    }
}

async function loadAndTranslateMonster(slug) {
    const monster = currentMonsters.find(m => m.slug === slug);
    if (!monster) return;

    document.querySelectorAll('.monster-item').forEach(el => el.classList.remove('active'));
    const activeEl = document.querySelector(`[data-slug="${slug}"]`);
    if (activeEl) activeEl.classList.add('active');

    const loader = document.getElementById('loading');
    loader.style.display = 'flex';

    try {
        const nameEs = translateMonsterName(monster.name);
        const alignEs = translateAlignment(monster.alignment);
        const sizeEs = dndDictionary[monster.size] || monster.size || '—';
        const typeEs = dndDictionary[monster.type] || monster.type || '—';
        const armorDescEs = replaceTechnicalTerms(monster.armor_desc || 'natural');
        const sensesEs = replaceTechnicalTerms(monster.senses);
        const languagesEs = replaceTechnicalTerms(monster.languages);

        const traitsPromises = (monster.special_abilities || []).map(async t => ({
            name: replaceTechnicalTerms(t.name),
            desc: await translate(t.desc)
        }));

        const actionsPromises = (monster.actions || []).map(async a => ({
            name: replaceTechnicalTerms(a.name),
            desc: await translate(a.desc)
        }));

        const descPromise = monster.desc ? translate(monster.desc) : Promise.resolve('');

        const [translatedTraits, translatedActions, translatedDesc] = await Promise.all([
            Promise.all(traitsPromises),
            Promise.all(actionsPromises),
            descPromise
        ]);

        const content = document.getElementById('content');
        content.innerHTML = `
            <div class="statblock-header">
                <h2 class="statblock-title">${nameEs}</h2>
            </div>

            <div class="property-line"><strong>Tipo:</strong> ${typeEs.toLowerCase()}</div>
            <div class="property-line"><strong>Tamaño:</strong> ${sizeEs.toLowerCase()}</div>
            <div class="property-line"><strong>Alineamiento:</strong> ${alignEs.toLowerCase()}</div>

            <div class="taper-line"></div>

            <div class="property-line"><strong>Clase de Armadura:</strong> ${monster.armor_class || '—'} (${armorDescEs})</div>
            <div class="property-line"><strong>Puntos de Golpe:</strong> ${monster.hit_points || '—'} (${monster.hit_dice || '—'})</div>
            <div class="property-line"><strong>Velocidad:</strong> ${formatSpeed(monster.speed)}</div>

            <table class="abilities-table">
                <thead>
                    <tr>
                        <th>FUE</th><th>DES</th><th>CON</th><th>INT</th><th>SAB</th><th>CAR</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>${formatMod(monster.strength)}</td>
                        <td>${formatMod(monster.dexterity)}</td>
                        <td>${formatMod(monster.constitution)}</td>
                        <td>${formatMod(monster.intelligence)}</td>
                        <td>${formatMod(monster.wisdom)}</td>
                        <td>${formatMod(monster.charisma)}</td>
                    </tr>
                </tbody>
            </table>

            <div class="property-line"><strong>Sentidos:</strong> ${sensesEs}</div>
            <div class="property-line"><strong>Idiomas:</strong> ${languagesEs}</div>
            <div class="property-line"><strong>Desafío:</strong> ${monster.challenge_rating || '—'}</div>

            <div class="taper-line"></div>

            ${translatedTraits.map(t => `
                <div class="action-block">
                    <span class="action-name">${t.name}.</span>${t.desc}
                </div>
            `).join('')}

            ${translatedActions.length > 0 ? `<div class="section-header">Acciones</div>` : ''}
            ${translatedActions.map(a => `
                <div class="action-block">
                    <span class="action-name">${a.name}.</span>${a.desc}
                </div>
            `).join('')}

            ${translatedDesc ? `
                <div class="description-text">
                    <strong>Descripción:</strong>
                    </div>
            ` : ''}
        `;
    } catch (err) {
        console.error("Error al renderizar el monstruo:", err);
    } finally {
        loader.style.display = 'none';
    }
}

window.addEventListener('DOMContentLoaded', () => {
    const searchInput = document.getElementById('searchInput');
    const typeFilter = document.getElementById('typeFilter');
    const crFilter = document.getElementById('crFilter');

    const handleFilterChange = () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(() => {
            fetchMonsterList();
        }, 300);
    };

    searchInput.addEventListener('input', handleFilterChange);
    typeFilter.addEventListener('change', fetchMonsterList);
    crFilter.addEventListener('change', fetchMonsterList);

    fetchMonsterList();
});
</script>

</body>
</html>
