<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compendio de Monstruos - D&D 5e</title>
    <style>
        :root {
            --primary-red: #8b0000;
            --dark-red: #580000;
            --bg-paper: #f4e9d8;
            --card-bg: #fffdfa;
            --statblock-bg: #fdf6e7;
            --text-color: #2b1810;
            --border-color: #c9ad80;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: var(--bg-paper);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--primary-red);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-red);
            margin: 0;
            text-transform: uppercase;
        }

        .subtitle {
            font-style: italic;
            color: #666;
            margin-top: 5px;
        }

        .app-layout {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .app-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Sidebar / Lista */
        .sidebar {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .search-bar {
            width: 100%;
            padding: 8px 12px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--statblock-bg);
            margin-bottom: 12px;
            font-family: inherit;
        }

        .monster-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
        }

        .monster-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .monster-item:hover {
            background-color: var(--statblock-bg);
        }

        .monster-item.active {
            background-color: var(--primary-red);
            color: white;
            border-radius: 4px;
        }

        .monster-item.active .monster-cr {
            color: #ffd700;
        }

        .monster-cr {
            font-size: 0.85em;
            color: var(--primary-red);
            font-weight: bold;
        }

        /* Ficha Técnica (Statblock) */
        .statblock-container {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            position: relative;
            min-height: 400px;
        }

        .statblock-header {
            border-bottom: 2px solid var(--primary-red);
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .statblock-title {
            color: var(--primary-red);
            margin: 0;
            font-size: 1.8em;
        }

        .statblock-meta {
            font-style: italic;
            font-size: 0.95em;
            color: #555;
            margin-top: 2px;
        }

        .taper-line {
            height: 5px;
            background: linear-gradient(to right, var(--primary-red), transparent);
            margin: 10px 0;
        }

        .property-line {
            color: var(--dark-red);
            margin: 4px 0;
            font-size: 0.95em;
        }

        .property-line strong {
            color: var(--text-color);
        }

        .abilities-table {
            width: 100%;
            text-align: center;
            border-collapse: collapse;
            margin: 15px 0;
            background-color: var(--statblock-bg);
            border-radius: 4px;
            padding: 5px;
        }

        .abilities-table th {
            color: var(--primary-red);
            font-size: 0.85em;
            text-transform: uppercase;
            padding: 4px;
        }

        .abilities-table td {
            font-size: 0.95em;
            padding: 4px;
        }

        .section-header {
            color: var(--primary-red);
            font-size: 1.2em;
            border-bottom: 1px solid var(--primary-red);
            margin-top: 15px;
            margin-bottom: 8px;
            padding-bottom: 2px;
        }

        .action-block {
            margin-bottom: 10px;
            font-size: 0.95em;
            line-height: 1.4;
        }

        .action-name {
            font-weight: bold;
            font-style: italic;
        }

        .description-text {
            font-size: 0.95em;
            line-height: 1.5;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px dashed var(--border-color);
            color: #444;
        }

        .status-msg {
            text-align: center;
            color: #777;
            font-style: italic;
            padding: 40px;
        }

        .loading-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.85);
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: var(--primary-red);
            font-size: 1.2em;
            border-radius: 6px;
            z-index: 10;
        }
    </style>
</head>

function translateMonsterName(name) {
    return monsterNamesDict[name] || name;
}

function translateAlignment(alignment) {
    if (!alignment) return "Sin alineamiento";
    const lowerAlign = alignment.toLowerCase().trim();
    return alignmentsDict[lowerAlign] || alignment;
}

function formatMod(score) {
    if (score === undefined || score === null) return '—';
    const mod = Math.floor((score - 10) / 2);
    return `${score} (${mod >= 0 ? '+' + mod : mod})`;
}

async function fetchMonsterList(query = '') {
    const listElement = document.getElementById('monsterList');
    listElement.innerHTML = '<li class="monster-item">Cargando resultados...</li>';

    try {
        const url = query 
            ? `https://api.open5e.com/v1/monsters/?search=${encodeURIComponent(query)}&limit=30`
            : `https://api.open5e.com/v1/monsters/?limit=30`;
        
        const response = await fetch(url);
        if (!response.ok) throw new Error("Error en la respuesta de la red");
        
        const data = await response.json();
        currentMonsters = data.results || [];

        listElement.innerHTML = '';
        if (currentMonsters.length === 0) {
            listElement.innerHTML = '<li class="monster-item">No se encontraron monstruos.</li>';
            return;
        }

        currentMonsters.forEach(monster => {
            const translatedName = translateMonsterName(monster.name);
            const li = document.createElement('li');
            li.className = 'monster-item';
            li.id = `item-${monster.slug}`;
            
            // Asignar evento click directamente
            li.addEventListener('click', () => {
                loadAndTranslateMonster(monster.slug);
            });

            li.innerHTML = `
                <span>${translatedName}</span>
                <span class="monster-cr">CR ${monster.challenge_rating || '—'}</span>
            `;
            listElement.appendChild(li);
        });

    } catch (error) {
        console.error("Error cargando la lista:", error);
        listElement.innerHTML = '<li class="monster-item">Error al conectar con la API.</li>';
    }
}

async function fetchSingleChunkTranslation(chunk) {
    if (!chunk || chunk.trim() === '') return '';
    try {
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(chunk)}&langpair=en|es`);
        const data = await res.json();
        return data.responseData?.translatedText || chunk;
    } catch (e) {
        return chunk;
    }
}

async function translate(text) {
    if (!text || text.trim() === '') return '';
    
    if (text.length <= 450) {
        return await fetchSingleChunkTranslation(text);
    }

    const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
    let chunks = [];
    let currentChunk = "";

    for (const sentence of sentences) {
        if ((currentChunk + sentence).length > 400) {
            chunks.push(currentChunk.trim());
            currentChunk = sentence;
        } else {
            currentChunk += " " + sentence;
        }
    }
    if (currentChunk.trim() !== "") {
        chunks.push(currentChunk.trim());
    }

    const translatedChunks = await Promise.all(
        chunks.map(chunk => fetchSingleChunkTranslation(chunk))
    );

    return translatedChunks.join(" ");
}

function replaceTechnicalTerms(str) {
    if (!str) return '—';
    let result = str;
    for (const [key, val] of Object.entries(dndDictionary)) {
        const regex = new RegExp(`\\b${key}\\b`, 'gi');
        result = result.replace(regex, val);
    }
    return result;
}

async function loadAndTranslateMonster(slug) {
    const monster = currentMonsters.find(m => m.slug === slug);
    if (!monster) return;

    document.querySelectorAll('.monster-item').forEach(el => el.classList.remove('active'));
    document.getElementById(`item-${slug}`)?.classList.add('active');

    const loader = document.getElementById('loading');
    loader.style.display = 'flex';

    try {
        // 1. Traducciones inmediatas por diccionario local
        const nameEs = translateMonsterName(monster.name);
        const alignEs = translateAlignment(monster.alignment);
        const sizeEs = dndDictionary[monster.size] || monster.size || '';
        const typeEs = dndDictionary[monster.type] || monster.type || '';
        const armorDescEs = replaceTechnicalTerms(monster.armor_desc || 'natural');
        const sensesEs = replaceTechnicalTerms(monster.senses);
        const languagesEs = replaceTechnicalTerms(monster.languages);

        // 2. Traducción de rasgos especiales y acciones en paralelo
        const traitsPromises = (monster.special_abilities || []).map(async t => ({
            name: dndDictionary[t.name] || t.name,
            desc: await translate(t.desc)
        }));

        const actionsPromises = (monster.actions || []).map(async a => ({
            name: dndDictionary[a.name] || a.name,
            desc: await translate(a.desc)
        }));

        const descPromise = monster.desc ? translate(monster.desc) : Promise.resolve("Sin descripción extendida.");

        const [translatedTraits, translatedActions, translatedDesc] = await Promise.all([
            Promise.all(traitsPromises),
            Promise.all(actionsPromises),
            descPromise
        ]);

        const content = document.getElementById('content');
        content.innerHTML = `
            <div class="statblock-header">
                <h2 class="statblock-title">${nameEs}</h2>
                <div class="statblock-meta">${sizeEs} ${typeEs}, ${alignEs}</div>
            </div>
            <div class="taper-line"></div>

            <div class="property-line"><strong>Clase de Armadura:</strong> ${monster.armor_class || '—'} (${armorDescEs})</div>
            <div class="property-line"><strong>Puntos de Golpe:</strong> ${monster.hit_points || '—'} (${monster.hit_dice || '—'})</div>
            <div class="property-line"><strong>Velocidad:</strong> ${formatSpeed(monster.speed)}</div>

            <table class="abilities-table">
                <thead>
                    <tr>
                        <th>FUE</th><th>DES</th><th>CON</th><th>I
