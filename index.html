<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compendio de Monstruos - D&D 5e (Auto-Traducción)</title>
    <style>
        :root {
            --primary-red: #8b0000;
            --dark-red: #580000;
            --bg-paper: #f4e9d8;
            --card-bg: #fffdfa;
            --statblock-bg: #fdf6e7;
            --text-color: #2b1810;
            --border-color: #c9ad80;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background-color: var(--bg-paper);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--primary-red);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-red);
            margin: 0;
            text-transform: uppercase;
        }

        .subtitle {
            font-style: italic;
            color: #666;
            margin-top: 5px;
        }

        .app-layout {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .app-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Sidebar / Lista */
        .sidebar {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-height: 80vh;
            display: flex;
            flex-direction: column;
        }

        .search-bar {
            width: 100%;
            padding: 8px 12px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background-color: var(--statblock-bg);
            margin-bottom: 12px;
            font-family: inherit;
        }

        .monster-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
        }

        .monster-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }

        .monster-item:hover {
            background-color: var(--statblock-bg);
        }

        .monster-item.active {
            background-color: var(--primary-red);
            color: white;
            border-radius: 4px;
        }

        .monster-item.active .monster-cr {
            color: #ffd700;
        }

        .monster-cr {
            font-size: 0.85em;
            color: var(--primary-red);
            font-weight: bold;
        }

        /* Ficha Técnica (Statblock) */
        .statblock-container {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 6px;
            padding: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            position: relative;
        }

        .statblock-header {
            border-bottom: 2px solid var(--primary-red);
            padding-bottom: 5px;
            margin-bottom: 10px;
        }

        .statblock-title {
            color: var(--primary-red);
            margin: 0;
            font-size: 1.8em;
        }

        .statblock-meta {
            font-style: italic;
            font-size: 0.95em;
            color: #555;
            margin-top: 2px;
        }

        .taper-line {
            height: 5px;
            background: linear-gradient(to right, var(--primary-red), transparent);
            margin: 10px 0;
        }

        .property-line {
            color: var(--dark-red);
            margin: 4px 0;
            font-size: 0.95em;
        }

        .property-line strong {
            color: var(--text-color);
        }

        .abilities-table {
            width: 100%;
            text-align: center;
            border-collapse: collapse;
            margin: 15px 0;
            background-color: var(--statblock-bg);
            border-radius: 4px;
            padding: 5px;
        }

        .abilities-table th {
            color: var(--primary-red);
            font-size: 0.85em;
            text-transform: uppercase;
            padding: 4px;
        }

        .abilities-table td {
            font-size: 0.95em;
            padding: 4px;
        }

        .section-header {
            color: var(--primary-red);
            font-size: 1.2em;
            border-bottom: 1px solid var(--primary-red);
            margin-top: 15px;
            margin-bottom: 8px;
            padding-bottom: 2px;
        }

        .action-block {
            margin-bottom: 10px;
            font-size: 0.95em;
            line-height: 1.4;
        }

        .action-name {
            font-weight: bold;
            font-style: italic;
        }

        .description-text {
            font-size: 0.95em;
            line-height: 1.5;
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px dashed var(--border-color);
            color: #444;
        }

        .status-msg {
            text-align: center;
            color: #777;
            font-style: italic;
            padding: 40px;
        }

        .loading-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.8);
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: var(--primary-red);
            font-size: 1.2em;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Compendio de Monstruos D&D 5e</h1>
        <div class="subtitle">Búsqueda vía API Open5e & Traducción Automática al Español</div>
    </header>

    <div class="app-layout">
        <div class="sidebar">
            <input type="text" id="searchInput" class="search-bar" placeholder="Buscar por nombre en inglés (ej: Dragon, Goblin)..." oninput="debounceSearch()">
            <ul class="monster-list" id="monsterList"></ul>
        </div>

        <div class="statblock-container" id="statblockView">
            <div id="loading" class="loading-overlay">Traduciendo datos del monstruo...</div>
            <div id="content">
                <div class="status-msg">Selecciona un monstruo de la lista para cargar y traducir su ficha.</div>
            </div>
        </div>
    </div>
</div>

<script>
let searchTimeout = null;
let currentMonsters = [];

// Diccionario de términos técnicos de D&D para traducción rápida y exacta
const dndDictionary = {
    // Tipos
    "aberration": "Aberración", "beast": "Bestia", "celestial": "Celestial", "construct": "Constructo",
    "dragon": "Dragón", "elemental": "Elemental", "fey": "Incorpóreo/Hada", "fiend": "Infernal",
    "giant": "Gigante", "humanoid": "Humanoide", "monstrosity": "Monstruosidad", "ooze": "Cieno",
    "plant": "Planta", "undead": "No-muerto",
    // Tamaños
    "Tiny": "Diminuto", "Small": "Pequeño", "Medium": "Mediano", "Large": "Grande", "Huge": "Enorme", "Gargantuan": "Gargantesco",
    // Alineamientos
    "lawful good": "Legal Bueno", "neutral good": "Neutral Bueno", "chaotic good": "Caótico Bueno",
    "lawful neutral": "Legal Neutral", "neutral": "Neutral", "chaotic neutral": "Caótico Neutral",
    "lawful evil": "Legal Maligno", "neutral evil": "Neutral Maligno", "chaotic evil": "Caótico Maligno",
    "unaligned": "Sin alineamiento",
    // Nombres de acciones habituales
    "Multiattack": "Multiataque", "Bite": "Mordisco", "Claw": "Garra", "Claws": "Garras", "Tail": "Cola", "Gore": "Cornada"
};

// Formateador con signo (+/-) para modificadores
function formatMod(score) {
    const mod = Math.floor((score - 10) / 2);
    return `${score} (${mod >= 0 ? '+' + mod : mod})`;
}

// Búsqueda en API con retardo para no saturar al escribir (Debounce)
function debounceSearch() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
        const query = document.getElementById('searchInput').value.trim();
        fetchMonsterList(query);
    }, 400);
}

// 1. Obtener lista de monstruos mediante la API de Open5e
async function fetchMonsterList(query = '') {
    const listElement = document.getElementById('monsterList');
    listElement.innerHTML = '<li class="monster-item">Cargando resultados...</li>';

    try {
        const url = query 
            ? `https://api.open5e.com/monsters/?search=${encodeURIComponent(query)}&limit=30`
            : `https://api.open5e.com/monsters/?limit=30`;
        
        const response = await fetch(url);
        const data = await response.json();
        currentMonsters = data.results;

        listElement.innerHTML = '';
        if (currentMonsters.length === 0) {
            listElement.innerHTML = '<li class="monster-item">No se encontraron monstruos.</li>';
            return;
        }

        currentMonsters.forEach(monster => {
            const li = document.createElement('li');
            li.className = 'monster-item';
            li.id = `item-${monster.slug}`;
            li.onclick = () => loadAndTranslateMonster(monster.slug);
            li.innerHTML = `
                <span>${monster.name}</span>
                <span class="monster-cr">CR ${monster.challenge_rating}</span>
            `;
            listElement.appendChild(li);
        });

    } catch (error) {
        console.error("Error cargando la lista:", error);
        listElement.innerHTML = '<li class="monster-item">Error al conectar con la API.</li>';
    }
}

// API de traducción de texto público (MyMemory)
async function translate(text) {
    if (!text || text.trim() === '') return '';
    try {
        const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|es`);
        const data = await res.json();
        return data.responseData.translatedText || text;
    } catch (e) {
        return text; // Si falla la red de traducción, retorna en inglés
    }
}

// 2. Cargar ficha y traducir dinámicamente
async function loadAndTranslateMonster(slug) {
    const monster = currentMonsters.find(m => m.slug === slug);
    if (!monster) return;

    // Actualizar selección visual
    document.querySelectorAll('.monster-item').forEach(el => el.classList.remove('active'));
    document.getElementById(`item-${slug}`)?.classList.add('active');

    // Mostrar pantalla de carga
    const loader = document.getElementById('loading');
    loader.style.display = 'flex';

    // Traducir tipo, tamaño y alineamiento usando diccionario o API
    const sizeEs = dndDictionary[monster.size] || monster.size;
    const typeEs = dndDictionary[monster.type] || monster.type;
    const alignEs = dndDictionary[monster.alignment] || await translate(monster.alignment);

    // Traducir rasgos especiales y acciones en paralelo
    const traitsPromises = (monster.special_abilities || []).map(async t => ({
        name: dndDictionary[t.name] || t.name,
        desc: await translate(t.desc)
    }));

    const actionsPromises = (monster.actions || []).map(async a => ({
        name: dndDictionary[a.name] || a.name,
        desc: await translate(a.desc)
    }));

    const descPromise = monster.desc ? translate(monster.desc) : Promise.resolve("Sin descripción extendida.");

    const [translatedTraits, translatedActions, translatedDesc] = await Promise.all([
        Promise.all(traitsPromises),
        Promise.all(actionsPromises),
        descPromise
    ]);

    // Renderizar la ficha traducida
    const content = document.getElementById('content');
    content.innerHTML = `
        <div class="statblock-header">
            <h2 class="statblock-title">${monster.name}</h2>
            <div class="statblock-meta">${sizeEs} ${typeEs}, ${alignEs}</div>
        </div>
        <div class="taper-line"></div>

        <div class="property-line"><strong>Clase de Armadura:</strong> ${monster.armor_class} (${monster.armor_desc || 'natural'})</div>
        <div class="property-line"><strong>Puntos de Golpe:</strong> ${monster.hit_points} (${monster.hit_dice})</div>
        <div class="property-line"><strong>Velocidad:</strong> ${formatSpeed(monster.speed)}</div>

        <table class="abilities-table">
            <thead>
                <tr>
                    <th>FUE</th><th>DES</th><th>CON</th><th>INT</th><th>SAB</th><th>CAR</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>${formatMod(monster.strength)}</td>
                    <td>${formatMod(monster.dexterity)}</td>
                    <td>${formatMod(monster.constitution)}</td>
                    <td>${formatMod(monster.intelligence)}</td>
                    <td>${formatMod(monster.wisdom)}</td>
                    <td>${formatMod(monster.charisma)}</td>
                </tr>
            </tbody>
        </table>

        <div class="property-line"><strong>Sentidos:</strong> ${monster.senses}</div>
        <div class="property-line"><strong>Idiomas:</strong> ${monster.languages || '—'}</div>
        <div class="property-line"><strong>Desafío (CR):</strong> ${monster.challenge_rating}</div>

        <div class="taper-line"></div>

        ${translatedTraits.map(t => `
            <div class="action-block">
                <span class="action-name">${t.name}.</span>${t.desc}
            </div>
        `).join('')}

        ${translatedActions.length > 0 ? `<div class="section-header">Acciones</div>` : ''}
        ${translatedActions.map(a => `
            <div class="action-block">
                <span class="action-name">${a.name}.</span>${a.desc}
            </div>
        `).join('')}

        <div class="description-text">
            <strong>Descripción:</strong> ${translatedDesc}
        </div>
    `;

    loader.style.display = 'none';
}

// Formateador de velocidades (a pie, vuelo, natación)
function formatSpeed(speedObj) {
    if (!speedObj) return '0 ft.';
    let parts = [];
    if (speedObj.walk) parts.push(`${speedObj.walk} ft.`);
    if (speedObj.fly) parts.push(`vuelo ${speedObj.fly} ft.`);
    if (speedObj.swim) parts.push(`natación ${speedObj.swim} ft.`);
    if (speedObj.climb) parts.push(`escalada ${speedObj.climb} ft.`);
    return parts.join(', ') || '0 ft.';
}

// Inicialización
window.onload = () => {
    fetchMonsterList();
};
</script>

</body>
</html>
